# Synapse + Postgres + Caddy (HTTPS automático) + matrix-wacloud.
# Passo a passo no README, seção "Implantação".

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data/synapse:/data
      - ./data/bridge/registration.yaml:/bridge/registration.yaml:ro

  bridge:
    build: .
    restart: unless-stopped
    depends_on: [synapse]
    env_file: .env
    volumes:
      - ./data/bridge:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [synapse, bridge]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${MATRIX_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
